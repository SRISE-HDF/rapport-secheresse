# À placer dans : .github/workflows/meteo.yml
name: Chargement SIM mensuel Météo-France

on:
  schedule:
  - cron: "10 15 * * *"   # tous les jours à 5h17 UTC (7h17 heure de Paris en été)
# le script s'arrête en quelques secondes si rien n'a changé
workflow_dispatch:        # bouton « Run workflow » pour lancer à la main
  inputs:
  annee:
  description: "Année à charger (vide = année en cours)"
required: false
default: ""

jobs:
  chargement:
  runs-on: ubuntu-latest
timeout-minutes: 30
steps:
  - name: Récupérer le dépôt
uses: actions/checkout@v4

- name: Installer R
uses: r-lib/actions/setup-r@v2
with:
  use-public-rspm: true   # binaires précompilés : installation rapide

- name: Installer les packages
uses: r-lib/actions/setup-r-dependencies@v2
with:
  packages: |
  any::httr2
any::jsonlite
any::data.table
any::dplyr
any::aws.s3

- name: Lancer le script
env:
  ANNEE: ${{ inputs.annee }}
S3_BUCKET: ${{ secrets.S3_BUCKET }}
S3_PREFIX: meteo/
  AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY }}
AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_KEY }}
AWS_S3_ENDPOINT: minio.lab.sspcloud.fr
run: Rscript R/01_chargement_sim_mensuel.R
