name: Chargement SIM mensuel Météo-France

on:
  schedule:
    - cron: "55 15 * * *"
  workflow_dispatch:
    inputs:
      annee:
        description: "Année à charger (vide = année en cours)"
        required: false
        default: ""

jobs:
  chargement:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Installer les packages
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::httr2
            any::jsonlite
            any::data.table
            any::dplyr
            any::aws.s3
            any::R.utils

      - name: Lancer le script
        env:
          ANNEE: ${{ inputs.annee }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_PREFIX: meteo/
          AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_KEY }}
          AWS_S3_ENDPOINT: minio.lab.sspcloud.fr
        run: Rscript 01_charger_sim_mensuel.R
